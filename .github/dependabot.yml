version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The types follow the Node runtime (.node-version, esbuild target node22): a new major comes
      # with a runtime bump, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /dist/identifiers
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

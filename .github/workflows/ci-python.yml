name: CI Python

# Runs a Python repo's checks in one job: one install, then each command as its own group. The install follows
# what the repo has: `uv.lock` → `uv sync`, else `pyproject.toml` → `pip install -e .` (plus the `dev` extra
# when the project declares one), else `requirements.txt` → `pip install -r`. A failing command fails the job,
# and every command still runs, so one run shows every red.
on:
  workflow_call:
    inputs:
      runner:
        description: JSON do runs-on
        type: string
        default: '["ubuntu-latest"]'
      python-version:
        description: Versão do Python (ignorada quando o repo tem .python-version)
        type: string
        default: '3.12'
      comandos:
        description: JSON com os comandos a rodar, na ordem
        type: string
        default: '["python -m pytest"]'
      timeout:
        type: number
        default: 20
      env:
        description: JSON de variáveis de ambiente para os comandos
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versão do Python
        id: versao
        env:
          PADRAO: ${{ inputs.python-version }}
        run: |
          if [ -f .python-version ]; then echo "arquivo=.python-version" >> "$GITHUB_OUTPUT"; else echo "versao=$PADRAO" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.versao.outputs.versao }}
          python-version-file: ${{ steps.versao.outputs.arquivo }}
      - name: Variáveis
        env:
          VARS: ${{ inputs.env }}
        run: python -c 'import json, os; f = open(os.environ["GITHUB_ENV"], "a"); [f.write(f"{k}={v}\n") for k, v in json.loads(os.environ["VARS"]).items()]'
      - name: Dependências
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            python -m pip install --quiet uv
            uv sync --frozen
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          elif [ -f pyproject.toml ]; then
            python -m pip install --quiet --upgrade pip
            if python -c 'import sys, tomllib; d = tomllib.load(open("pyproject.toml", "rb")); sys.exit(0 if "dev" in d.get("project", {}).get("optional-dependencies", {}) else 1)'; then
              python -m pip install --quiet -e '.[dev]'
            else
              python -m pip install --quiet -e .
            fi
          elif [ -f requirements.txt ]; then
            python -m pip install --quiet -r requirements.txt
          else
            echo "Sem uv.lock, pyproject.toml nem requirements.txt: nada a instalar." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comandos
        env:
          COMANDOS: ${{ inputs.comandos }}
        run: |
          set -uo pipefail
          falhou=0
          while IFS= read -r -d '' comando; do
            echo "::group::$comando"
            if bash -c "$comando"; then
              echo "✅ \`$comando\`" >> "$GITHUB_STEP_SUMMARY"
            else
              falhou=1
              echo "::error title=CI Python::falhou: $comando"
              echo "❌ \`$comando\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done < <(python -c 'import json, os, sys; [sys.stdout.write(c + "\0") for c in json.loads(os.environ["COMANDOS"])]')
          exit $falhou
